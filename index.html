<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電話查詢系統</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 18px;
            background-image: url('517.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .search-container {
            display: flex;
            flex-direction: row;
            margin-bottom: 10px;
        }

        #searchInput {
            flex-grow: 1;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #searchButton {
            padding: 10px 15px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }

        #searchButton:hover {
            background-color: #0056b3;
        }

        .system-remark {
            font-size: 16px;
            color: #888;
            text-align: left; /* 設定靠左對齊 */
            margin-top: 15px;
            margin-bottom: -10px;
            padding: 5px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px; /* 修改手機版的邊界，讓容器與邊緣留距離 */
                padding: 15px; /* 保持內部間距 */
            }

            h1 {
                font-size: 22px;
            }

            #searchInput {
                width: 100%; /* 確保輸入框寬度適應容器 */
            }

            #searchButton {
                padding: 8px 12px;
                font-size: 16px;
            }

            .system-remark {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>電話查詢系統</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="輸入關鍵字 (姓名、單位或地點)" />
            <button id="searchButton">查詢</button>
        </div>
        <p class="system-remark">此系統僅供方便查詢使用，不作即時更新連動</p>
        <div id="resultsContainer"></div>
    </div>
</body>
</html>
